{
  "name": "简体中文 — 反馈、故障或翻译",
  "description": "报告问题、提出改进建议或修正翻译。",
  "title": "[zh-Hans] ",
  "body": [
    {
      "type": "dropdown",
      "id": "kind",
      "attributes": {
        "label": "反馈类型",
        "options": [
          "故障",
          "续航估算或耗电",
          "翻译",
          "功能建议",
          "其他反馈"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "你的 Mac 与 Akku",
        "description": "型号/芯片（M1–M5）、macOS 版本、Akku 版本和语言。不要填写序列号。"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "details",
      "attributes": {
        "label": "发生了什么，或希望如何改进？",
        "description": "请写明步骤、预期和实际结果。翻译问题请提供界面、现有文字和建议表述。"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "power",
      "attributes": {
        "label": "供电与相关情况",
        "description": "是否接电、开启低电量模式或连接外接屏幕？只填写相关情况。"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "隐私",
        "options": [
          {
            "label": "我已从文字与附件中移除个人信息、地址、坐标和秘密凭据。",
            "required": true
          }
        ]
      }
    }
  ]
}
