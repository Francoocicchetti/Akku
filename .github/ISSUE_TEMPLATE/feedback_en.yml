{
  "name": "English — feedback, bug or translation",
  "description": "Report a problem, suggest an improvement or correct a translation.",
  "title": "[en] ",
  "body": [
    {
      "type": "dropdown",
      "id": "kind",
      "attributes": {
        "label": "What kind of feedback is this?",
        "options": [
          "Bug",
          "Battery estimate or energy use",
          "Translation",
          "Feature idea",
          "Other feedback"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Your Mac and Akku",
        "description": "Model/chip (M1–M5), macOS version, Akku version and language. No serial number."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "details",
      "attributes": {
        "label": "What happened or what would you improve?",
        "description": "Include steps and expected/actual results. For translations, include the screen, current text and suggested wording."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "power",
      "attributes": {
        "label": "Power and context",
        "description": "Was the charger connected? Low Power Mode? External display? Add only context relevant to the report."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Privacy",
        "options": [
          {
            "label": "I removed personal information, addresses, coordinates and secrets from any text or attachments.",
            "required": true
          }
        ]
      }
    }
  ]
}
